function drawNode(n) {
  const g = el("g", {});
  const w = n.w || (n.k === "dec" ? 100 : 150);
  const tagH = n.tag ? 20 : 0;
  const h = n.h || (n.k === "dec" ? 56 : n.k === "pill" ? 30 : 52 + (n.tag ? 10 : 0));
  n._w = w; n._h = h;
  const x = n.x - w / 2, y = n.y - h / 2;
  if (n.k === "dec") {
    el("path", { d: `M${n.x},${y} L${n.x + w / 2},${n.y} L${n.x},${y + h} L${x},${n.y} z`, fill: "#fef3c7", stroke: "#d97706", "stroke-width": 1.5 }, g);
    lines(g, n.x, n.y, n.t, { size: 12, lh: 14 });
  } else if (n.k === "pill") {
    el("rect", { x, y, width: w, height: h, rx: h / 2, fill: "#1f2937" }, g);
    lines(g, n.x, n.y, n.t, { size: 12, lh: 14, fill: "#fff", weight: 700 });
  } else {
    const style = {
      task: { fill: "#ffffff", stroke: "#334155", dash: n.dashed ? "5 3" : "" },
      sys: { fill: "#e8f0fe", stroke: "#3b5bdb", dash: "" },
      view: { fill: "#f3f4f6", stroke: "#6b7280", dash: "5 3" },
      batch: { fill: "#ecfdf5", stroke: "#0f766e", dash: "5 3" },
    }[n.k];
    el("rect", { x, y, width: w, height: h, rx: 6, fill: style.fill, stroke: style.stroke, "stroke-width": 1.4, "stroke-dasharray": style.dash }, g);
    const textY = n.tag ? n.y - tagH / 2 + 1 : n.y;
    lines(g, n.x, textY, n.t, { size: 12, lh: 15 });
    if (n.tag) {
      const tw = n.tag.length * 11 + 14;
      el("rect", { x: n.x - tw / 2, y: y + h - 18, width: tw, height: 14, rx: 7, fill: TAG[n.tag] || "#6b7280" }, g);
      lines(g, n.x, y + h - 11, n.tag, { size: 10, fill: "#fff", weight: 700 });
    }
  }
  if (n.n) {
    const bw = n.n.length * 7 + 10;
    el("rect", { x: x - 4, y: y - 9, width: bw, height: 15, rx: 3, fill: "#111827" }, g);
    lines(g, x - 4 + bw / 2, y - 1.5, n.n, { size: 10, fill: "#fff", weight: 700 });
  }
  if (n.c) {
    el("circle", { cx: x + w - 2, cy: y - 2, r: 10, fill: "#dc2626" }, g);
    lines(g, x + w - 2, y - 2, n.c, { size: 9, fill: "#fff", weight: 700 });
  }
  if (n.note) lines(g, n.x, y + h + 11, n.note, { size: 10.5, fill: "#6b7280" });
}

function drawEdge(e) {
  const s = EDGE[e.k];
  if (!e.plain) {
    const d = e.p.map((pt, i) => (i ? "L" : "M") + pt[0] + "," + pt[1]).join(" ");
    el("path", { d, fill: "none", stroke: s.c, "stroke-width": 1.6, "stroke-dasharray": s.d, "marker-end": e.noArrow ? "" : `url(#a-${e.k})` });
  }
  if (e.l) {
    const [lx, ly] = e.at;
    const g = el("g", {});
    const t = lines(g, lx, ly, e.l, { size: e.small ? 10.5 : 11, fill: e.plain ? "#6b7280" : s.c, weight: e.plain ? 400 : 700, lh: 14 });
    const b = t.getBBox();
    const bg = el("rect", { x: b.x - 4, y: b.y - 1, width: b.width + 8, height: b.height + 2, rx: 3, fill: "#fff", opacity: 0.92 });
    g.insertBefore(bg, t);
  }
}

E.forEach(drawEdge);

function panel(x, y, w, h, title, sub) {
  el("rect", { x, y, width: w, height: h, rx: 8, fill: "#fff", stroke: "#e5e7eb" });
  lines(svg, x + 16, y + 22, title, { anchor: "start", size: 16, weight: 700, fill: "#111827" });
  if (sub) lines(svg, x + 16, y + 44, sub, { anchor: "start", size: 11.5, fill: "#6b7280" });
}
function chip(x, y, t, c, w = 130, h = 36) {
  el("rect", { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 6, fill: c });
  lines(svg, x, y, t, { size: 12, fill: "#fff", weight: 700, lh: 14 });
}
function arrow(pts, k, label, at, opt = {}) {
  drawEdge({ p: pts, k, l: label, at: at || pts[0], ...opt });
}
function table(x, y, cols, rows, opt = {}) {
  const rh = opt.rh || 24;
  let cx = x;
  const total = cols.reduce((a, c) => a + c[1], 0);
  el("rect", { x, y, width: total, height: rh, fill: "#1f2937" });
  cols.forEach(([name, w]) => { lines(svg, cx + 8, y + rh / 2, name, { anchor: "start", size: 11.5, fill: "#fff", weight: 700 }); cx += w; });
  rows.forEach((r, i) => {
    const ry = y + rh * (i + 1);
    el("rect", { x, y: ry, width: total, height: rh, fill: i % 2 ? "#f9fafb" : "#fff" });
    el("line", { x1: x, y1: ry + rh, x2: x + total, y2: ry + rh, stroke: "#eef0f3" });
    let cx2 = x;
    r.forEach((v, j) => {
      if (j === 0 && opt.tagFirst) {
        const tw = v.length * 11 + 16;
        el("rect", { x: cx2 + 8, y: ry + 5, width: tw, height: rh - 10, rx: 7, fill: TAG[v] || "#6b7280" });
        lines(svg, cx2 + 8 + tw / 2, ry + rh / 2, v, { size: 10.5, fill: "#fff", weight: 700 });
      } else lines(svg, cx2 + 8, ry + rh / 2, v, { anchor: "start", size: 11.5, fill: "#374151" });
      cx2 += cols[j][1];
    });
  });
}
