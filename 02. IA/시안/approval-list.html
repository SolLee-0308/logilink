<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<title>LogiLink 승인 대기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Sora:wght@600&display=swap">
<style>
/* Layout: 검정 사이드바 + 흰 콘텐츠 카드. 콘텐츠는 목록(왼쪽) + 상세 패널(오른쪽) 분할. 단일 라이트 테마(업무 화면 시안) */
:root{
  color-scheme:light;
  --violet-50:#EFEDFE; --violet-100:#E2DEFD; --violet-300:#A99FF8; --violet-500:#7C6CF2; --violet-600:#6C5CE7; --violet-700:#5B4BD6;
  --ink:#161616; --ink-2:#212121; --ink-line:#2C2C2E; --ink-text:#B9B9BE;
  --bg:#FFFFFF; --surface:#FAFAFB; --line:#ECECEF; --line-2:#E2E2E7; --fg:#18181B; --muted:#6B6B73; --soft:#9A9AA2;
  --wait-bg:#FFF4CC; --wait-fg:#7A5600; --rej-bg:#FDE7E7; --rej-fg:#B42318; --ok-bg:#DFF1FF; --ok-fg:#075E9E;
  --done-bg:#E1F5E8; --done-fg:#1C7343; --warn-bg:#FFF1E6; --warn-fg:#A6430A;
  --f-display:"Sora","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--violet-500);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);gap:10px;min-height:100%}

/* 사이드바 */
.side{color:var(--ink-text);display:flex;flex-direction:column;gap:4px;padding:4px}
.brand{background:var(--ink-2);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.word{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.02em;color:#fff}
.word b{font-weight:600;color:var(--violet-300)}
.brand small{display:block;font-size:11px;color:#8A8A90}
.grp{font-size:11px;letter-spacing:.06em;color:#6E6E75;padding:12px 12px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;font-size:14px;color:var(--ink-text);text-decoration:none}
.nav:hover{background:#1C1C1E}
.nav.on{background:var(--ink-2);color:var(--violet-300)}
.nav .cnt{margin-left:auto;background:var(--violet-500);color:#fff;font-size:11px;font-weight:600;border-radius:6px;padding:0 6px;font-family:var(--f-mono)}
.side .user{margin-top:auto;background:var(--ink-2);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px;color:#E4E4E7}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--violet-600);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.user small{display:block;color:#8A8A90;font-size:11px}

/* 메인 */
.main{background:var(--bg);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.crumb{font-size:12px;color:var(--soft);display:flex;gap:6px;align-items:center}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head h1{font-size:21px;font-weight:600;margin:0}
.count{background:var(--violet-50);color:var(--violet-700);font-family:var(--f-mono);font-size:12px;font-weight:500;border-radius:6px;padding:1px 7px}
.head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{font-size:13px;font-weight:500;border-radius:10px;padding:8px 14px;border:1px solid var(--line-2);background:#fff;color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#C9C9D0}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#2A2A2A}
.btn.danger{color:var(--rej-fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.help{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--muted);font-size:12px;display:grid;place-items:center}

/* 조회조건 */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,input[type="text"],textarea{font:inherit;font-size:13px;border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;background:#fff;color:var(--fg)}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;padding-left:32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--soft)}
.chips{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:3px}
.chips button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* 탭 */
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;align-self:flex-start}
.tabs button{border:0;background:transparent;font-size:13px;padding:6px 14px;border-radius:8px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--violet-600);color:#fff;font-weight:500}
.tabs .n{font-family:var(--f-mono);font-size:12px}

/* 본문 분할 */
.body{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start;min-height:0}
.listcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.tablewrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:#8E8E96;background:var(--surface);padding:9px 10px;white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px} th:last-child{border-radius:0 10px 10px 0}
th.num,td.num{text-align:right}
td{padding:11px 10px;border-bottom:1px solid #F0F0F2;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#FBFBFC}
tbody tr.active td{background:var(--violet-50)}
tbody tr.active td:first-child{box-shadow:inset 3px 0 0 var(--violet-600)}
tbody tr.conflict td{background:#FFF7F7}
.chk{width:16px;height:16px;accent-color:var(--violet-600);cursor:pointer;vertical-align:middle}
.sub{display:block;font-size:11px;color:var(--soft)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-wait{background:var(--wait-bg);color:var(--wait-fg)} .b-rej{background:var(--rej-bg);color:var(--rej-fg)} .b-ok{background:var(--ok-bg);color:var(--ok-fg)}
.tag{display:inline-block;font-size:11px;font-weight:500;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.t-rev{background:var(--violet-50);color:var(--violet-700)}
.t-over{background:var(--warn-bg);color:var(--warn-fg)}
.t-conf{background:var(--rej-bg);color:var(--rej-fg)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px}

/* 상세 패널 */
.panel{border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;flex-direction:column;position:sticky;top:10px;max-height:calc(100vh - 40px);min-width:0}
.panel-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.panel-head .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-head h2{font-size:16px;margin:0;font-family:var(--f-mono);font-weight:500}
.panel-body{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.sect{display:flex;flex-direction:column;gap:8px}
.sect h3{font-size:13px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.lines td,.lines th{padding:7px 8px}
.lines td{white-space:normal}
.diff-up{color:var(--ok-fg);font-weight:600} .diff-down{color:var(--rej-fg);font-weight:600}
.diff-new{color:var(--violet-700);font-weight:600}
.note{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.err{background:var(--rej-bg);color:#7A1A12}
.note.warn{background:var(--warn-bg);color:#7A3507}
.note.info{background:var(--violet-50);color:#3F3399}
.note .act{margin-top:6px}
.timeline{display:flex;flex-direction:column;gap:10px;font-size:13px}
.tl{display:grid;grid-template-columns:14px 1fr;gap:10px}
.tl .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--line-2)}
.tl .dot.rej{background:var(--rej-fg)} .tl .dot.ok{background:var(--ok-fg)} .tl .dot.save{background:var(--violet-500)}
.tl small{color:var(--soft);display:block}
.panel-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.panel-foot .ver{margin-right:auto;font-size:12px;color:var(--soft)}

/* 모달 */
.scrim{position:fixed;inset:0;background:rgba(22,22,22,.45);display:grid;place-items:center;padding:16px;z-index:30}
.modal{background:#fff;border-radius:18px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.modal header{padding:18px 20px 8px}
.modal header h2{margin:0;font-size:17px}
.modal header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.modal .mb{padding:10px 20px;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.modal label{font-size:13px;font-weight:500;display:flex;flex-direction:column;gap:6px}
.modal label span.req{color:var(--rej-fg)}
.modal select,.modal textarea{width:100%}
.modal textarea{min-height:76px;resize:vertical}
.err-text{color:var(--rej-fg);font-size:12px}
.targets{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px;max-height:140px;overflow:auto}
.result-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.result-row:last-child{border-bottom:0}
.result-row .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ic.ok{background:var(--done-bg);color:var(--done-fg)} .ic.no{background:var(--rej-bg);color:var(--rej-fg)}

/* 규칙 시트 */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:25;box-shadow:-12px 0 32px rgba(0,0,0,.12);display:flex;flex-direction:column;padding-right:env(safe-area-inset-right,0px)}
.sheet header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.sheet header h2{margin:0;font-size:16px}
.sheet header button{margin-left:auto}
.sheet .sb{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;font-size:13px}
.rule{display:grid;grid-template-columns:34px 1fr;gap:10px}
.rule .id{font-family:var(--f-mono);font-size:12px;color:var(--violet-700);background:var(--violet-50);border-radius:6px;text-align:center;height:22px;line-height:22px}
.rule p{margin:2px 0 0;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.sim{font-size:12px;color:var(--soft);display:flex;align-items:center;gap:6px}

@media (max-width:1240px){.body{grid-template-columns:1fr}.panel{position:static;max-height:none}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.head .right{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="logo" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#7C6CF2"/><path d="M20 8.5 31 14.5 20 20.5 9 14.5Z" fill="#FFFFFF"/><path d="M9 16.8 18.9 22.2V32.5L9 27.1Z" fill="#D9D4FD"/><path d="M31 16.8 21.1 22.2V32.5L31 27.1Z" fill="#FFFFFF" fill-opacity=".72"/><path d="M14.5 11.5 25.5 17.5" stroke="#7C6CF2" stroke-width="2"/></symbol>
</defs></svg>

<div class="app">
  <aside class="side" aria-label="메뉴">
    <div class="brand"><svg width="34" height="34"><use href="#logo"/></svg><div><div class="word">Logi<b>Link</b></div><small>3PL · 용인1센터</small></div></div>
    <div class="grp">입고 계획</div>
    <a class="nav on" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8.5 6.5 12 13 4.5"/></svg>승인 대기<span class="cnt" id="navCount">0</span></a>
    <a class="nav" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 6h6M5 9h4"/></svg>입고예정 조회</a>
    <a class="nav" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 5h8v6h-8zM9.5 7h3l2 2v2h-5"/><circle cx="4" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/></svg>ASN·상차 현황</a>
    <div class="grp">입고 운영</div>
    <a class="nav" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M5.5 6h5M5.5 9h3"/></svg>입고검수 실적</a>
    <a class="nav" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg>잔량 종결·일마감</a>
    <div class="grp">관리</div>
    <a class="nav" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>기준정보</a>
    <div class="user"><span class="avatar">김</span><div>김하늘<small>3PL 운영담당</small></div></div>
  </aside>

  <main class="main">
    <div class="crumb">입고 계획 <span>›</span> 승인 대기</div>
    <div class="head">
      <h1>승인 대기</h1><span class="count" id="headCount">0</span>
      <button class="help" type="button" id="openRules" aria-label="화면 규칙 보기">?</button>
      <div class="right">
        <span class="sim">시안 · 예시 데이터 · 기준일 2026-11-02</span>
        <button class="btn sm" type="button" id="resetBtn">예시 초기화</button>
      </div>
    </div>

    <div class="filters" role="search">
      <label class="field" for="fShipper">화주사
        <select id="fShipper"><option value="">전체</option></select>
      </label>
      <div class="field">입고예정일
        <div class="chips" id="fDate">
          <button type="button" data-v="all" aria-pressed="true">전체</button>
          <button type="button" data-v="over" aria-pressed="false">기한 지남</button>
          <button type="button" data-v="today" aria-pressed="false">오늘</button>
          <button type="button" data-v="tomorrow" aria-pressed="false">내일</button>
          <button type="button" data-v="later" aria-pressed="false">모레 이후</button>
        </div>
      </div>
      <label class="field" for="fRev"><input type="checkbox" id="fRev" class="chk"> 재요청 건만</label>
      <div class="search"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.8"/><path d="m10.5 10.5 3 3"/></svg><input type="text" id="fQ" placeholder="입고예정번호, 품목명 검색" aria-label="검색"></div>
    </div>

    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" type="button" id="tab-wait" data-t="wait" aria-selected="true">승인대기 <span class="n" id="n-wait">0</span></button>
      <button role="tab" type="button" id="tab-rej" data-t="rej" aria-selected="false">반려 · 화주사 수정 중 <span class="n" id="n-rej">0</span></button>
      <button role="tab" type="button" id="tab-done" data-t="done" aria-selected="false">오늘 처리 <span class="n" id="n-done">0</span></button>
    </div>

    <div class="body">
      <div class="listcol">
        <div class="tablewrap">
          <table>
            <thead><tr id="thead"></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="empty" id="empty" hidden>조건에 맞는 입고예정이 없습니다. 조회조건을 바꿔 보세요.</div>
      </div>
      <aside class="panel" id="panel" aria-label="입고예정 상세"></aside>
    </div>
  </main>
</div>

<div id="layer"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
var TODAY='2026-11-02';
var REJ_CODES=[
  {c:'R01',n:'품목 정보 오류'},{c:'R02',n:'수량 확인 필요'},{c:'R03',n:'입고예정일 조정 필요'},
  {c:'R04',n:'센터 입고 여력 부족'},{c:'R05',n:'중복 등록'},{c:'R99',n:'기타'}];

function seed(){return [
 {no:'IP-20261102-0031',sh:'한빛식품',date:'2026-11-03',st:'wait',rev:1,ver:2,sv:2,way:'엑셀 업로드',by:'박민지',at:'2026-11-02 09:12',
  lines:[{code:'HB-1001',name:'국산콩 두부 300g',u:'BOX',q:120},{code:'HB-1004',name:'유기농 콩나물 500g',u:'BOX',q:80},{code:'HB-2210',name:'생수 2L×6',u:'PLT',q:4},{code:'HB-3105',name:'김치 3kg',u:'BOX',q:45}],hist:[{k:'save',t:'2026-11-02 08:40',m:'박민지 · 최초 저장 (v1)'},{k:'save',t:'2026-11-02 09:12',m:'박민지 · 수정 저장 (v2)'}]},

var S={plans:seed(),tab:'wait',sel:new Set(),active:null,f:{sh:'',date:'all',rev:false,q:''}};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function byNo(no){return S.plans.find(function(p){return p.no===no})}
function dday(d){var a=new Date(d+'T00:00:00'),b=new Date(TODAY+'T00:00:00');return Math.round((a-b)/864e5)}
function ddLabel(d){var n=dday(d);return n<0?'D+'+(-n):n===0?'오늘':'D-'+n}
function qty(p){return p.lines.reduce(function(s,l){return s+l.q},0)}
function codeName(c){var x=REJ_CODES.find(function(r){return r.c===c});return x?x.n:''}
function badge(st){return st==='wait'?'<span class="badge b-wait">승인대기</span>':st==='rej'?'<span class="badge b-rej">반려</span>':'<span class="badge b-ok">승인</span>'}
function inTab(p){return S.tab==='done'?(p.st==='ok'||(p.st==='rej'&&p.doneAt)):p.st===S.tab&&!(S.tab==='rej'&&false)}
function tabOf(p){return p.st==='wait'?'wait':p.st==='rej'?'rej':'done'}

function filtered(){
  return S.plans.filter(function(p){
    if(tabOf(p)!==S.tab)return false;
    if(S.f.sh&&p.sh!==S.f.sh)return false;
    var n=dday(p.date);
    if(S.f.date==='over'&&n>=0)return false;
    if(S.f.date==='today'&&n!==0)return false;
    if(S.f.date==='tomorrow'&&n!==1)return false;
    if(S.f.date==='later'&&n<2)return false;
    if(S.f.rev&&p.rev<2)return false;
    if(S.f.q){var q=S.f.q.toLowerCase();if(p.no.toLowerCase().indexOf(q)<0&&!p.lines.some(function(l){return l.name.toLowerCase().indexOf(q)>=0}))return false}
    return true;
  }).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.no<b.no?-1:1});
}

function renderCounts(){
  var c={wait:0,rej:0,done:0};S.plans.forEach(function(p){c[tabOf(p)]++});
  $('n-wait').textContent=c.wait;$('n-rej').textContent=c.rej;$('n-done').textContent=c.done;
  $('navCount').textContent=c.wait;$('headCount').textContent=c.wait;
}

  }).join('');
  $('empty').hidden=rows.length>0;

  Array.prototype.forEach.call(document.querySelectorAll('#tbody tr'),function(tr){tr.classList.toggle('active',tr.dataset.no===S.active)});

function reload(p){
  var old={};p.lines.forEach(function(l){old[l.code]=l.q});
  p.lines=p.next.map(function(l){var c={code:l.code,name:l.name,u:l.u,q:l.q};
    if(old[l.code]===undefined)c._chg='<span class="diff-new">추가됨</span>';
    else if(old[l.code]!==l.q)c._chg='<span class="diff-up">'+old[l.code]+'→'+l.q+'</span>';return c});
  p.ver=p.sv;p._conflict=false;p.at='2026-11-02 11:42';p.hist.push({k:'save',t:'2026-11-02 11:42',m:'정서준 · 수정 저장 (v'+p.sv+')'});
  toast('최신 내용(v'+p.sv+')을 불러왔습니다. 변경된 품목을 확인하세요.');render();
}

function check(p){return p.ver===p.sv}
function approve(nos){
  var res=nos.map(function(no){var p=byNo(no);
    if(!check(p)){p._conflict=true;return {no:no,ok:false,m:'화주사가 수정한 건입니다(v'+p.ver+' → v'+p.sv+'). 변경 내용을 확인 후 다시 처리하세요.'}}
    p.st='ok';p.apRev=p.rev;p.doneAt='2026-11-02 11:45';p.hist.push({k:'ok',t:'2026-11-02 11:45',m:'김하늘 · 승인 (승인 차수 '+p.rev+')'});S.sel.delete(no);
    return {no:no,ok:true,m:'승인 완료 · 승인 차수 '+p.rev+' 기록, 수정 잠금'}});
  finish(res,'승인');
}
function finish(res,verb){
  var ok=res.filter(function(r){return r.ok}).length, ng=res.length-ok;
  if(res.length===1&&ok===1){toast(res[0].no+' '+verb+' 완료');render();return}
  if(res.length===1){toast(verb+'하지 못했습니다. 화주사가 수정한 건입니다.');render();return}
  if(ng===0){toast(ok+'건 '+verb+' 완료');render();return}
  var html='<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h2 id="mt">'+verb+' 결과 · '+ok+'건 완료, '+ng+'건 실패</h2><p>건별로 판정해 바뀐 건만 처리하지 않았습니다.</p></header><div class="mb">'+
    res.map(function(r){return '<div class="result-row"><span class="ic '+(r.ok?'ok':'no')+'">'+(r.ok?'✓':'!')+'</span><div><span class="mono">'+r.no+'</span><div style="color:var(--muted)">'+esc(r.m)+'</div></div></div>'}).join('')+
    '</div><footer><button class="btn primary" type="button" id="mClose">확인</button></footer></div></div>';
  $('layer').innerHTML=html;$('mClose').focus();
  $('mClose').onclick=closeLayer;render();
}

function openReject(nos){
  var ps=nos.map(byNo);
  $('layer').innerHTML='<div class="scrim" id="scrim"><form class="modal" id="rejForm" role="dialog" aria-modal="true" aria-labelledby="rt" novalidate>'+
    '<header><h2 id="rt">입고예정 반려</h2><p>반려하면 현재 전표가 반려본으로 보관되고, 화주사가 수정 후 재저장할 수 있습니다.</p></header><div class="mb">'+
    '<div class="targets">'+ps.map(function(p){return '<div><span class="mono">'+p.no+'</span> · '+esc(p.sh)+' · '+p.rev+'차</div>'}).join('')+'</div>'+
    '<label for="rCode">반려 사유 <span class="req">*</span><select id="rCode"><option value="">사유를 선택하세요</option>'+REJ_CODES.map(function(r){return '<option value="'+r.c+'">'+r.n+'</option>'}).join('')+'</select></label>'+
    '<label for="rText"><span id="rTextLabel">상세 내용 (선택)</span><textarea id="rText" placeholder="화주사가 무엇을 고쳐야 하는지 적어 주세요."></textarea></label>'+
    '<div class="err-text" id="rErr" hidden></div>'+
    '<div class="sub">사유 코드는 공통코드(반려 사유) 그룹의 임시안입니다.</div>'+
    '</div><footer><button class="btn" type="button" id="rCancel">취소</button><button class="btn primary" type="submit">반려</button></footer></form></div>';
  var code=$('rCode'),txt=$('rText');
  code.onchange=function(){$('rTextLabel').innerHTML=code.value==='R99'?'상세 내용 <span class="req">*</span>':'상세 내용 (선택)'};
  $('rCancel').onclick=closeLayer;code.focus();
  $('rejForm').onsubmit=function(e){e.preventDefault();
    var err='';if(!code.value)err='반려 사유를 선택하세요.';else if(code.value==='R99'&&!txt.value.trim())err='"기타"를 고르면 상세 내용을 입력해야 합니다.';
    if(err){$('rErr').textContent=err;$('rErr').hidden=false;return}
    closeLayer();
    var res=nos.map(function(no){var p=byNo(no);
      if(!check(p)){p._conflict=true;return {no:no,ok:false,m:'화주사가 수정한 건입니다(v'+p.ver+' → v'+p.sv+'). 변경 내용을 확인 후 다시 처리하세요.'}}
      p.st='rej';p.rejCode=code.value;p.doneAt='2026-11-02 11:45';
      p.hist.push({k:'rej',t:'2026-11-02 11:45',m:'김하늘 · 반려 ('+p.rev+'차) · '+codeName(code.value),d:txt.value.trim()});S.sel.delete(no);
      return {no:no,ok:true,m:'반려 완료 · '+p.rev+'차 반려본 보관'}});
    finish(res,'반려');
  };
}

    ['D3','전표 단위 승인','라인별 부분 승인은 없습니다. 승인하면 승인 차수를 기록하고 수정을 잠급니다.'],
    ['D6','반려본 스냅샷','반려 시 헤더와 라인 전체를 n차 반려본으로 보관합니다(수정·삭제 불가). 재저장 시 차수 +1.'],
    ['D19','반려 사유','공통코드 드롭다운에서 고르고, "기타"는 상세 내용이 필수입니다.'],
    ['D18','기한경과 취소','입고예정일이 지난 승인대기·반려 건은 일마감 때 자동으로 취소됩니다.'],
    ['C3','승인 건 취소','이 화면이 아니라 입고예정 조회에서 처리합니다(후행 전표 없을 때만, 사유 필수).']];
  $('layer').innerHTML='<div class="scrim" id="scrim" style="background:rgba(22,22,22,.25)"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="st"><header><h2 id="st">이 화면의 업무 규칙</h2><button class="btn sm" type="button" id="sClose">닫기</button></header><div class="sb">'+
    '<div class="sub">근거: 입고 업무프로세스 정의서 v1.4</div>'+
    R.map(function(r){return '<div class="rule"><span class="id">'+r[0]+'</span><div><strong>'+r[1]+'</strong><p>'+r[2]+'</p></div></div>'}).join('')+
    '<div class="note info"><div><strong>시뮬레이션 안내</strong><br>IP-20261102-0027(오션푸드)은 상세를 연 뒤 화주사가 수정한 건으로 설정해 두었습니다. 승인을 누르면 처리가 막히고, "변경 내용 불러오기"로 최신 내용을 확인한 뒤 다시 처리할 수 있습니다.</div></div></div></aside>';
  $('sClose').onclick=closeLayer;$('scrim').onclick=closeLayer;$('sClose').focus();
}
function closeLayer(){$('layer').innerHTML=''}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('layer').innerHTML)closeLayer()});

var tt;function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600)}

function render(){renderCounts();renderTable();renderPanel()}

// events
var shs=[];S.plans.forEach(function(p){if(shs.indexOf(p.sh)<0)shs.push(p.sh)});
$('fShipper').innerHTML+=shs.map(function(s){return '<option>'+s+'</option>'}).join('');
$('fShipper').onchange=function(e){S.f.sh=e.target.value;render()};
$('fRev').onchange=function(e){S.f.rev=e.target.checked;render()};
$('fQ').oninput=function(e){S.f.q=e.target.value.trim();render()};
Array.prototype.forEach.call(document.querySelectorAll('#fDate button'),function(b){b.onclick=function(){
  S.f.date=b.dataset.v;Array.prototype.forEach.call(document.querySelectorAll('#fDate button'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});render()}});
Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){
  S.tab=b.dataset.t;S.sel.clear();S.active=null;Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(x){x.setAttribute('aria-selected',x===b?'true':'false')});render()}});
$('tbody').addEventListener('click',function(e){var tr=e.target.closest('tr');if(!tr)return;var no=tr.dataset.no;
  S.active=no;renderTable();renderPanel()});
$('tbody').addEventListener('keydown',function(e){if(e.key==='Enter'){var tr=e.target.closest('tr');if(tr){S.active=tr.dataset.no;renderTable();renderPanel()}}});
$('openRules').onclick=openRules;
$('resetBtn').onclick=function(){S.plans=seed();S.sel.clear();S.active=null;closeLayer();render();toast('예시 데이터를 처음 상태로 되돌렸습니다.')};
render();
})();
</script>
